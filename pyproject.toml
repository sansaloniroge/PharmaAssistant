[tool.poetry]
name = "pharma-assistant"
version = "0.1.0"
description = "Chatbot farmacéutico basado en Langchain y OpenAI"
authors = ["Roge Sansaloni <sansaloniroge@gmail.com>"]
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
urllib3 = "1.26.16"
pandas = "2.2.3"
numpy = "2.0.2"
openai = "^1.86.0"
python-dotenv = "1.1.0"
azure = "4.0.0"
azure-identity = "1.21.0"
azure-keyvault-secrets = "4.9.0"
tiktoken = "0.9.0"
faiss-cpu = "^1.11.0"
pyyaml = "^6.0.2"
unidecode = "^1.3.8"
pytest = "^8.3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
