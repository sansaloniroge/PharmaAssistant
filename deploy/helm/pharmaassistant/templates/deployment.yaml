apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pharmaassistant.fullname" . }}
  labels:
    {{- include "pharmaassistant.labels" . | nindent 6 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "pharmaassistant.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "pharmaassistant.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: APP_ENV
              value: {{ .Values.env.APP_ENV | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
          # Probes mínimas desactivadas por ahora para evitar 404 si no existen endpoints
          # readinessProbe:
          #   httpGet:
          #     path: /readyz
          #     port: http
          # livenessProbe:
          #   httpGet:
          #     path: /healthz
          #     port: http
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 10 }}
      tolerations:
        {{- toYaml .Values.tolerations | nindent 10 }}
      affinity:
        {{- toYaml .Values.affinity | nindent 10 }}
