[tool.poetry]
name = "pharma-assistant"
version = "0.1.0"
description = "Chatbot farmacéutico basado en Langchain y OpenAI"
authors = ["Roge Sansaloni <sansaloniroge@gmail.com>"]
readme = "README.md"

packages = [
  { include = "app", from = "src" },
  { include = "service", from = "src" },
  { include = "scripts", from = "src" }
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src:stubs"
explicit_package_bases = true
namespace_packages = true
files = ["src/app", "src/service", "src/scripts", "tests"]

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
urllib3 = "1.26.16"
pandas = "2.2.3"
numpy = "2.0.2"
openai = "^1.86.0"
python-dotenv = "1.1.0"
azure = "4.0.0"
azure-identity = "1.21.0"
azure-keyvault-secrets = "4.9.0"
tiktoken = "0.9.0"
faiss-cpu = "^1.11.0"
pyyaml = "^6.0.2"
unidecode = "^1.3.8"
fastapi = "^0.116.1"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pydantic = "^2.11.7"
prometheus-client = "^0.20.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-cov = "^5.0.0"
ruff = "^0.6.9"
mypy = "^1.11.0"
types-pyyaml = "^6.0.12.20250915"

[tool.poetry.scripts]
build-index = "scripts.build_index:main"
rebuild-all = "scripts.rebuild_all:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
