name: Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

permissions:
  id-token: write    # para OIDC con AWS
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPO: pharmaassistant

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from pyproject
        id: ver
        run: |
          PY_VER=$(python - <<'PY'
import tomllib,sys
with open('pyproject.toml','rb') as f:
    print(tomllib.load(f)['tool']['poetry']['version'])
PY
)
          echo "py_ver=$PY_VER" >> $GITHUB_OUTPUT
          echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}   # <-- configura este secret
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: tags
        run: |
          REG="${{ steps.ecr.outputs.registry }}"
          IMG="$REG/${{ env.ECR_REPO }}"
          SHA="${{ steps.ver.outputs.sha_short }}"
          VER="${{ steps.ver.outputs.py_ver }}"

          TAGS="$IMG:${SHA}"
          if [[ "${GITHUB_REF}" == refs/heads/main ]]; then
            TAGS="$TAGS,$IMG:latest,$IMG:${VER}"
          fi
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAGS="$TAGS,$IMG:${TAG}"
          fi

          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "image=$IMG" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache
          cache-to: type=registry,ref=${{ steps.tags.outputs.image }}:buildcache,mode=max

      - name: Output image list
        run: echo "Pushed: ${{ steps.tags.outputs.tags }}"
