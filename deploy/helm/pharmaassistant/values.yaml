replicaCount: 2

image:
  repository: <ACCOUNT>.dkr.ecr.eu-west-1.amazonaws.com/pharmaassistant
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: nginx
  host: api.tu-dominio.com
  tls:
    enabled: true
    secretName: pharmaassistant-tls  # cert-manager lo gestiona

env:
  ALLOWED_ORIGINS: "https://tu-frontend.com,https://admin.tu-frontend.com"
  PRELOAD_TENANTS: "client_1,client_2"

# OJO: para demo. En producción, mejor Secrets/DB
tenantsYaml: |
  tenants:
    client_1:
      api_key: "secret_key_client_1"
      max_requests_per_day: 1000
    client_2:
      api_key: "secret_key_client_2"
      max_requests_per_day: 500

secret:
  create: true
  name: pharmaassistant-secrets
  openaiApiKey: ""   # rellena con helm --set-file o en CI

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "1"
    memory: "1Gi"

nodeSelector: {}
tolerations: []
affinity: {}

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 60
