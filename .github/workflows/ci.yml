name: CI

on:
  pull_request:
    branches: ["*"]

permissions:
  contents: read

jobs:
  lint-test:
    name: Lint / Typecheck / Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: "2.1.3"

      - name: Cache Poetry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Verify pyproject + lock
        run: |
          poetry --version
          poetry check --lock

      - name: Install deps
        run: |
          poetry install --no-interaction --no-root --sync

      - name: Ruff (lint)
        run: poetry run ruff check .

      - name: mypy (typecheck)
        run: poetry run mypy .

      - name: Pytest (with coverage)
        run: poetry run pytest -q --cov --cov-report=xml

      - name: Upload coverage XML
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  docker-build:
    name: Build Docker (no push)
    runs-on: ubuntu-latest
    needs: lint-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: test/pharmaassistant:pr-${{ github.event.pull_request.number || github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
